name: docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 校验已构建面板
        run: python hub/tests/_test_panel_assets.py

      - name: 登录 ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: 版本标签
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF_NAME" ]; then TAG="$(python - <<PY
          import re, io
          s = io.open("hub/__init__.py", encoding="utf-8").read()
          print(re.search(r'HUB_VERSION = "([^"]+)"', s).group(1))
          PY
          )"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "版本: $TAG"

      # 用经典 docker build / docker push（不用 buildx）：
      # buildx 走 OCI 推送 + attestation，GHCR 侧曾连续 500；经典路径只推 manifest+blobs。
      - name: 构建
        run: |
          docker build \
            --label "org.opencontainers.image.title=WorkBuddy x Qoder x Trae-hub" \
            --label "org.opencontainers.image.description=三引擎融合网关：一个进程、一个端口、一把 Key 调三家" \
            --label "org.opencontainers.image.version=${{ steps.ver.outputs.tag }}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.licenses=MIT" \
            -t "$IMAGE:${{ steps.ver.outputs.tag }}" .

      - name: 镜像启动验收
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          id=$(docker run -d -p 127.0.0.1::8817 "$IMAGE:$TAG")
          trap 'docker rm -f "$id" >/dev/null' EXIT
          endpoint=$(docker port "$id" 8817/tcp)
          for i in $(seq 1 80); do
            if curl -fsS --max-time 3 "http://$endpoint/api/hub/health" | jq -e '.engines | length == 3 and all(.[]; .ok == true)'; then
              curl -fsS "http://$endpoint/" -o /tmp/panel-index.html
              python -c 'import re,sys,urllib.request as u; refs=re.findall(r"(?:src|href)=\x22\.?(/static/[^\x22]+)\x22",open("/tmp/panel-index.html").read()); assert len(refs)>=2; [u.urlopen("http://"+sys.argv[1]+p, timeout=5).close() for p in refs]' "$endpoint"
              exit 0
            fi
            sleep 2
          done
          docker logs "$id"
          exit 1

      - name: 推送并核对远端标签
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          push() {
            for attempt in 1 2 3; do
              if docker push "$1"; then return 0; fi
              sleep 10
            done
            return 1
          }
          push "$IMAGE:$TAG"
          docker buildx imagetools inspect "$IMAGE:$TAG"
          if [[ "$GITHUB_REF_TYPE" == tag && "$TAG" != *-* ]]; then
            docker tag "$IMAGE:$TAG" "$IMAGE:latest"
            push "$IMAGE:latest"
            docker buildx imagetools inspect "$IMAGE:latest"
          fi
