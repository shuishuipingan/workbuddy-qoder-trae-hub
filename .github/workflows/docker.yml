name: docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: 版本标签
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF_NAME" ]; then TAG="$(python - <<PY
          import re, io
          s = io.open("hub/__init__.py", encoding="utf-8").read()
          print(re.search(r'HUB_VERSION = "([^"]+)"', s).group(1))
          PY
          )"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "版本: $TAG"

      # 用经典 docker build / docker push（不用 buildx）：
      # buildx 走 OCI 推送 + attestation，GHCR 侧曾连续 500；经典路径只推 manifest+blobs。
      - name: 构建
        run: |
          docker build -t "$IMAGE:${{ steps.ver.outputs.tag }}" -t "$IMAGE:latest" .

      - name: 推送（先带版本号，再 latest）
        run: |
          for i in 1 2 3; do
            docker push "$IMAGE:${{ steps.ver.outputs.tag }}" && break || { echo "第 $i 次失败，10s 后重试"; sleep 10; }
          done
          for i in 1 2 3; do
            docker push "$IMAGE:latest" && break || { echo "第 $i 次失败，10s 后重试"; sleep 10; }
          done

      - name: 校验标签
        run: |
          docker buildx imagetools inspect "$IMAGE:${{ steps.ver.outputs.tag }}" || true
